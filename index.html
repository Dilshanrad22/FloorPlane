<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIT EXPO 2026 | Floor Plan</title>
  <link rel="icon" href="assets/logo-uom.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="splashing">
  <div class="splash" id="splash" aria-hidden="true">
    <span class="blob blob-tl"></span>
    <span class="blob blob-br"></span>
    <div class="splash-inner">
      <div class="splash-logos">
        <img src="assets/logo-uom.png" alt="University of Moratuwa">
        <img src="assets/logo-fit25.png" alt="FIT 25 Years of Excellence">
      </div>
      <div class="expo-name">
        <span class="expo-title">FIT EXPO</span>
        <span class="expo-year">2026</span>
      </div>
      <p class="splash-sub">Floor Plan</p>
      <div class="loader"><span></span></div>
    </div>
    <span class="splash-bar"></span>
  </div>

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand-logos">
        <img src="assets/logo-uom.png" alt="University of Moratuwa">
        <img src="assets/logo-fit25.png" alt="FIT 25 Years of Excellence">
      </div>
      <div class="expo-name">
        <span class="expo-title">FIT EXPO</span>
        <span class="expo-year">2026</span>
      </div>
    </div>
  </header>

  <nav class="tabs-bar" aria-label="Floors">
    <div class="container">
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
  </nav>

  <section class="floor-head">
    <div class="container">
      <h2 id="floor-name"></h2>
      <p id="floor-sub"></p>
    </div>
  </section>

  <main class="container layout" id="floor-plan">
    <section class="plan-card">
      <img id="plan-img" alt="">
    </section>

    <aside class="side-card">
      <h3 id="side-title"></h3>
      <p class="side-caption" id="side-caption"></p>
      <ul id="zone-list"></ul>
    </aside>
  </main>

  <footer class="footer">
    <span>FIT EXPO 2026</span>
  </footer>

  <button class="to-top" id="to-top" aria-label="Scroll to top">&#8593;</button>

  <script src="script.js"></script>
</body>
</html>
